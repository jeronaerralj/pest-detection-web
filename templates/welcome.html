<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome | AI Pest Detection</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Global Reset */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(to bottom right, #c1eec0, #b7e4c7);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh; /* Allows scroll on small screens */
      margin: 0;
      padding: 20px; /* Prevents box from touching edges */
    }

    .welcome-box {
      background: white;
      border-radius: 25px;
      box-shadow: 0 6px 35px rgba(0, 0, 0, 0.2);
      padding: 70px 60px;
      text-align: center;
      width: 100%;
      max-width: 720px; /* Responsive width */
      border: 3px solid #6b8e23;
      animation: fadeIn 1s ease-out;
    }

    .logo-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
      opacity: 0;
      transform: translateY(-30px);
      animation: slideIn 1s ease-out forwards;
      animation-delay: 0.2s;
      flex-wrap: wrap; /* Wraps on very small screens */
    }

    .logo {
      font-size: 75px;
      color: #4caf50;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      color: #33691e;
      font-weight: 800;
      font-size: 3rem;
      margin: 0;
      line-height: 1.2;
      display: flex;
      align-items: center;
      text-align: left;
    }

    p {
      font-size: 1.5rem;
      color: #2f4f2f;
      margin: 30px 0 40px 0;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s ease forwards;
      animation-delay: 0.8s;
    }

    /* Button Wrapper for Layout Control */
    .button-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    .btn {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #6b8e23;
      color: white;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 18px 40px;
      border-radius: 15px;
      text-decoration: none;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 0.8s ease forwards;
      min-width: 180px; /* Ensures consistent button size */
    }

    .btn:nth-child(1) {
      animation-delay: 1.2s;
    }

    .btn:nth-child(2) {
      animation-delay: 1.4s;
    }

    .btn:hover {
      background-color: #4a6b1c;
      transform: translateY(-5px); /* Lift effect */
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Mobile Responsive Styles --- */
    @media (max-width: 768px) {
      .welcome-box {
        padding: 50px 30px;
      }

      .logo-title {
        flex-direction: column;
        gap: 10px;
      }

      h1 {
        font-size: 2rem;
        text-align: center;
        justify-content: center;
      }

      .logo {
        font-size: 60px;
      }

      /* Stack buttons vertically on mobile */
      .button-group {
        flex-direction: column;
        gap: 15px;
      }

      .btn {
        width: 100%; /* Full width for easy tapping */
        font-size: 1.2rem;
        padding: 15px;
        margin: 0; /* Reset margins */
      }
    }
  </style>
</head>

<body>
  <div class="welcome-box">
    <div class="logo-title">
      <div class="logo">🌿</div>
      <h1>Welcome to AI Pest Detection</h1>
    </div>
    <p>Select Access Type:</p>
    
    <div class="button-group">
      <a href="/login" class="btn">ADMIN</a>
      <a href="/user" class="btn">USER</a>
    </div>
  </div>
</body>

</html>
