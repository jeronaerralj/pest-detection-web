<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome | AI Pest Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Global Reset */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(to bottom right, #c1eec0, #b7e4c7);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Allows scrolling if content is too tall */
            margin: 0;
            padding: 20px; /* Prevents box from touching screen edges */
        }

        .welcome-box {
            background: white;
            border-radius: 25px;
            box-shadow: 0 6px 35px rgba(0, 0, 0, 0.2);
            padding: 50px 40px;
            text-align: center;
            width: 100%;
            max-width: 720px; /* Responsive width */
            border: 3px solid #6b8e23;
            animation: fadeIn 1s ease-out;
        }

        .logo-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(-30px);
            animation: slideIn 1s ease-out forwards;
            animation-delay: 0.2s;
            flex-wrap: wrap; /* Wraps logo and text on tiny screens */
        }

        .logo {
            font-size: 60px; /* Slightly smaller for better fit */
            color: #4caf50;
            line-height: 1;
        }

        h1 {
            color: #33691e;
            font-weight: 800;
            font-size: 2.5rem;
            margin: 0;
            line-height: 1.2;
        }

        p {
            font-size: 1.2rem;
            color: #2f4f2f;
            margin: 10px 0 30px 0;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s ease forwards;
            animation-delay: 0.6s;
        }

        /* --- GRID LAYOUT FOR BUTTONS --- */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 Columns by default */
            gap: 20px;
            width: 100%;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #90b645;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 20px;
            border-radius: 15px;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s ease forwards;
            width: 100%; /* Fills the grid cell */
        }

        /* Staggered Animation Delays */
        .btn:nth-child(1) { animation-delay: 0.7s; }
        .btn:nth-child(2) { animation-delay: 0.8s; }
        .btn:nth-child(3) { animation-delay: 0.9s; }
        .btn:nth-child(4) { animation-delay: 1.0s; }

        .btn:hover {
            background-color: #4a6b1c;
            transform: translateY(-3px); /* Subtle lift effect */
        }

        /* Secondary Button Styling */
        .btn-secondary {
            background-color: #e0e0e0;
            color: #555;
        }

        .btn-secondary:hover {
            background-color: #c4c4c4;
            color: #333;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            .welcome-box {
                padding: 40px 25px;
            }

            .logo-title {
                flex-direction: column;
                gap: 10px;
            }

            .logo { font-size: 50px; }
            h1 { font-size: 2rem; text-align: center; }

            /* Switch to 1 column on mobile */
            .button-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .btn {
                padding: 15px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="welcome-box">
        <div class="logo-title">
            <div class="logo">🦗</div>
            <h1>Hello, User!</h1>
        </div>
        
        <p>What would you like to do?</p>
        
        <div class="button-grid">
            <a href="/index" class="btn">Live Pest Detection</a>
            <a href="/upload" class="btn">Upload Pest Image</a>
            <a href="/library" class="btn">Pest Library</a>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</body>

</html>
