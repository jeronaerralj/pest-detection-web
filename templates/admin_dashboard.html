<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | AI Pest Detection</title>
  <style>
    /* Global Reset for layout calculation */
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #b9e7b2;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px; /* Prevents container from touching edges on small screens */
    }

    .dashboard {
      background: white;
      border: 2px solid #6b8e23;
      border-radius: 20px;
      /* Responsive Sizing */
      width: 100%;
      max-width: 750px; /* Mimics original size on desktop */
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.6s ease-in-out;
    }

    .dashboard h1 {
      color: #4b6043;
      font-size: 50px;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap; /* Allows icon to wrap on very small screens */
      gap: 12px;
      margin-bottom: 10px;
      line-height: 1.2;
    }

    .dashboard h2 {
      color: #2f3e27;
      font-size: 30px;
      margin-bottom: 40px;
      margin-top: 0;
    }

    .btn {
      display: block;
      /* Responsive Button Widths */
      width: 100%; 
      max-width: 500px;
      margin: 20px auto;
      padding: 15px 0;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: white;
      transition: all 0.2s ease;
    }

    .add-btn {
      background-color: #6b8e23;
    }

    .add-btn:hover {
      background-color: #4a6b1c;
    }

    .register-btn {
      background-color: #a7d129;
    }

    .register-btn:hover {
      background-color: #8fbf22;
    }

    .list-btn {
      background-color: #9ccc65;
    }

    .list-btn:hover {
      background-color: #7cb342;
    }

    .logout-btn {
      background-color: #7cb342;
      /* Keep logout distinct on desktop */
      max-width: 180px; 
      margin-top: 40px;
    }

    .logout-btn:hover {
      background-color: #9ccc65;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --- MOBILE RESPONSIVENESS --- */
    @media (max-width: 600px) {
      .dashboard {
        padding: 40px 20px;
      }

      .dashboard h1 {
        font-size: 32px; /* Smaller font for mobile */
      }

      .dashboard h2 {
        font-size: 20px;
        margin-bottom: 30px;
      }

      .btn {
        font-size: 16px; /* Slightly smaller text in buttons */
        padding: 12px 0;
      }

      /* On mobile, make the logout button full width for easier tapping */
      .logout-btn {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="dashboard">
    <h1>Admin Dashboard</h1>
    <h2>Welcome, Admin!</h2>
    
    <button class="btn add-btn" onclick="window.location.href='/add_pest'">+ Add New Pest</button>
    <button class="btn register-btn" onclick="window.location.href='/register'">+ Register New Admin</button>
    <button class="btn list-btn" onclick="window.location.href='/pest_list'">+ View Pest List</button>
    
    <button class="btn logout-btn" onclick="window.location.href='/'">Logout</button>
  </div>
</body>

</html>
