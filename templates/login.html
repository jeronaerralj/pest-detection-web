<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | AI Pest Detection</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Round" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* 1. Design Tokens (Matches Dashboard) */
    :root {
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-dark: #1f2937;
      --text-light: #6b7280;
      --border-color: #e5e7eb;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      font-family: "Inter", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: var(--text-dark);
    }

    /* 2. Login Card Container */
    .login-box {
      background: var(--card-bg);
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      padding: 40px;
      box-shadow: var(--shadow);
      /* Branding accent on top */
      border-top: 5px solid var(--primary);
    }

    .login-box h1 {
      color: var(--primary);
      font-family: "Poppins", sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      text-align: center;
      margin: 0 0 30px 0;
      letter-spacing: -0.5px;
    }

    /* 3. Form Elements */
    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-light);
      font-weight: 600;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px; /* Slightly rounded, not pill */
      font-size: 1rem;
      font-family: "Inter", sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: #f9fafb;
    }

    /* Focus State - Green Ring */
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--primary);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
    }

    /* 4. Buttons */
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 10px;
    }

    button {
      padding: 12px 0;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: "Inter", sans-serif;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .login-btn {
      background-color: var(--primary);
      color: white;
    }

    .login-btn:hover {
      background-color: var(--primary-hover);
    }

    .cancel-btn {
      background-color: #e5e7eb;
      color: var(--text-dark);
    }

    .cancel-btn:hover {
      background-color: #d1d5db;
    }

    /* 5. Error Message */
    .error {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 500;
      margin-top: 5px;
    }

    /* 6. Mobile Responsiveness */
    @media (max-width: 480px) {
      .login-box {
        padding: 30px 20px;
      }

      .button-group {
        grid-template-columns: 1fr; /* Stack buttons */
      }

      .cancel-btn {
        order: 2; /* Move Cancel to bottom on mobile */
      }
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h1>Admin Login</h1>

    <form method="POST" action="/login">
      
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required />
      </div>
      
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <div class="button-group">
        <button type="submit" class="login-btn">Login</button>
        <button type="button" class="cancel-btn" onclick="window.location.href='/'">
          Cancel
        </button>
      </div>

    </form>
  </div>
</body>

</html>
